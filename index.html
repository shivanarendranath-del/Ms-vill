<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Ms Villa</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ms Villa">
<meta name="theme-color" content="#F3E7C9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0E0D0B;
    --panel:rgba(26,22,15,0.62);
    --panel-2:rgba(212,168,83,0.14);
    --line:rgba(212,168,83,0.30);
    --ink:#F3E7C9;
    --accent:#D4A853;
    --accent-soft:#E9CD8E;
    --muted:#B8A97C;
    --danger:#E06B5C;
    --good:#4FBF8B;
    --font-display:'Inter', sans-serif;
    --font-body:'Inter', sans-serif;
    --body-bg: radial-gradient(circle at 12% 8%, rgba(212,168,83,.16), transparent 42%), radial-gradient(circle at 88% 18%, rgba(212,168,83,.08), transparent 45%), linear-gradient(160deg, #171410 0%, #0E0D0B 45%, #100E0A 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--body-bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body,'Work Sans', sans-serif);
    font-weight:700;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition: background .25s ease, color .25s ease;
  }
  h1,h2,h3,.serif{ font-family:var(--font-display,'Cormorant Garamond', serif); font-weight:900; letter-spacing:.01em; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:40px; position:relative; border-top:6px solid var(--accent); }

  .photo-hero{ position:relative; overflow:hidden; border-bottom:1px solid var(--line); }
  .hero-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(5px) saturate(1.08) brightness(0.97); transform:scale(1.15); }
  .hero-overlay{ position:absolute; inset:0; background:linear-gradient(180deg, color-mix(in srgb, var(--bg) 35%, transparent) 0%, color-mix(in srgb, var(--bg) 80%, transparent) 55%, color-mix(in srgb, var(--bg) 96%, transparent) 100%); }
  .hero-inner{ position:relative; z-index:2; }

  .crest{ text-align:center; padding:44px 20px 26px; }
  .crest-logo{ width:190px; max-width:70%; height:auto; display:block; margin:0 auto 4px; }
  .crest .mark{
    width:46px;height:46px;margin:0 auto 16px; border:1.5px solid var(--ink); border-radius:0;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .crest .mark svg{ width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:1.4; }
  .crest h1{ font-size:38px; font-style:normal; font-weight:900; margin:0; color:var(--ink); letter-spacing:-.01em; }
  .crest .sub{ color:var(--accent-soft); font-weight:800; font-size:11px; margin-top:8px; letter-spacing:.16em; text-transform:uppercase; }
  .dots{ display:flex; gap:6px; justify-content:center; margin-top:16px; }
  .dots span{ width:5px; height:5px; border-radius:50%; background:var(--accent-soft); }
  .dots span:first-child{ background:var(--ink); }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; margin:0 18px 16px; box-shadow:0 8px 24px rgba(22,39,63,.08); }
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  select, input[type=password], input[type=text], textarea{
    width:100%; background:rgba(255,255,255,0.92); border:1px solid var(--line); color:#16273F;
    padding:12px 12px; border-radius:10px; font-size:15px; font-family:var(--font-body,'Work Sans',sans-serif); margin-bottom:16px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  select option{ color:#16273F; background:#fff; }
  select, input[type=password], input[type=text], textarea{ font-weight:600; }
  ::placeholder{ color:#6B7A90; opacity:1; }
  textarea{ resize:vertical; min-height:80px; }
  select:focus, input:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  button{
    font-family:var(--font-body,'Work Sans',sans-serif); cursor:pointer; border:none; border-radius:4px; font-size:14px; font-weight:700;
  }
  .btn-primary{ width:100%; background:var(--accent); color:#16273F; padding:14px; letter-spacing:.04em; font-weight:800; text-transform:uppercase; font-size:13px; border-radius:12px; box-shadow:0 6px 16px rgba(240,160,48,.35); }
  .btn-primary:active{ background:#D68A20; }
  .btn-ghost{ width:100%; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:var(--muted); border:1px solid var(--line); padding:11px; margin-top:10px; font-weight:700; border-radius:12px; }
  .btn-line{ background:var(--panel-2); color:var(--accent); border:1.5px solid var(--accent); padding:9px 14px; font-size:13px; font-weight:700; border-radius:20px; }
  .error{ color:var(--danger); font-size:13px; margin:-8px 0 14px; }
  .msg{ color:var(--good); font-size:13px; margin:-8px 0 14px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:rgba(22,39,63,0.72); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); position:sticky; top:0; z-index:40; }
  .topbar .back{ color:#fff; font-size:14px; display:flex; align-items:center; gap:6px; }
  .topbar .who{ font-size:12px; color:var(--accent-soft); text-align:right; }
  .topbar .who b{ color:#fff; font-weight:700; }

  .house-title{ text-align:center; padding:6px 18px 20px; }
  .house-title h1{ font-size:32px; font-style:normal; font-weight:900; margin:0 0 4px; letter-spacing:-.01em; }
  .house-title .sub{ color:var(--muted); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 18px; }
  .room-tile{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 14px;
    display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
    box-shadow:0 8px 20px rgba(22,39,63,.07);
  }
  .room-tile svg{ width:26px; height:26px; stroke:var(--ink); }
  .room-tile .name{ font-size:14px; color:var(--ink); }
  .room-tile .count{ font-size:11px; color:var(--muted); }

  .quick-tile{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; cursor:pointer;
    box-shadow:0 8px 20px rgba(22,39,63,.07);
  }
  .quick-tile svg{ width:22px; height:22px; stroke:var(--ink); }
  .quick-tile .name{ font-size:13px; color:var(--ink); }

  .duty-strip{ margin:16px 18px 4px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:4px; padding:14px 16px; }
  .duty-strip .lbl{ font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .duty-strip .name{ font-size:20px; font-style:normal; font-family:var(--font-display,'Cormorant Garamond',serif); margin-top:2px; font-weight:800; }
  .duty-strip .sub2{ font-size:11px; color:var(--muted); margin-top:8px; }

  .dues-card{ text-align:left; border-left:3px solid var(--accent); }
  .dues-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .dues-label{ font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .dues-amount{ font-family:var(--font-display,'Cormorant Garamond',serif); font-weight:800; font-size:34px; color:var(--accent); margin:6px 0 2px; letter-spacing:-.01em; }
  .dues-note{ font-size:12.5px; color:var(--muted); font-weight:600; }

  .nav-row{ display:flex; gap:10px; padding:6px 18px 18px; }
  .nav-row button{ flex:1; }

  .section-title{ padding:0 18px; margin:22px 0 10px; font-size:12px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; }

  .member-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .member-row:last-child{ border-bottom:none; }
  .member-row .name{ font-size:14px; }
  .member-row .tag{ font-size:11px; color:var(--muted); }
  .avatar{ width:38px; height:38px; border-radius:50%; object-fit:cover; border:1px solid var(--accent-soft); }
  .avatar-empty{ width:38px; height:38px; border-radius:50%; background:var(--panel-2); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); }
  .left{ display:flex; align-items:center; gap:12px; }
  .status-pill{ font-size:11px; padding:4px 10px; border-radius:20px; font-weight:700; }
  .status-present{ background:rgba(27,138,90,.12); color:var(--good); }
  .status-pending{ background:rgba(78,122,144,.15); color:var(--muted); }
  .status-open{ background:rgba(10,110,189,.12); color:var(--accent); }
  .status-closed{ background:rgba(27,138,90,.12); color:var(--good); }
  .cam-btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:7px 10px; font-size:12px; border-radius:4px; }

  .instr-list{ padding:0 18px 18px; }
  .instr-list ol{ padding-left:20px; margin:0; }
  .instr-list li{ margin-bottom:14px; font-size:14px; line-height:1.5; color:#16273F; }
  .instr-note{ margin:0 18px 18px; padding:14px 16px; border:1px solid var(--line); border-radius:4px; font-size:13px; color:var(--accent); text-align:center; background:var(--panel); }

  .fab-add{ margin:0 18px 18px; }

  .modal-bg{ position:fixed; inset:0; background:rgba(22,39,63,.42); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal{ background:var(--modal-bg, rgba(255,255,255,0.92)); color:var(--ink); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:22px 18px 26px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; }
  .modal h3{ margin:0 0 14px; font-size:20px; font-style:normal; font-weight:800; }
  .chip-select{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip{ padding:8px 12px; border:1px solid var(--line); border-radius:20px; font-size:13px; color:var(--muted); cursor:pointer; }
  .chip.on{ border-color:var(--ink); color:var(--ink); background:var(--panel-2); }

  .foot-note{ text-align:center; color:var(--muted); font-size:11px; padding:10px 18px 0; }
  input[type=file]{ display:none; }

  .info-block{ margin:0 18px 16px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  .info-block .lbl{ font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }

  .weekday-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); }
  .weekday-row:last-child{ border-bottom:none; }
  .weekday-row .day{ font-size:13px; color:var(--muted); width:90px; }
  .weekday-row.today{ color:var(--ink); }
  .weekday-row .who{ font-size:14px; text-align:right; flex:1; }
  .weekday-row.today .who{ color:var(--ink); font-family:var(--font-display,'Cormorant Garamond',serif); font-style:normal; font-weight:800; font-size:16px; }

  .pay-btn-row{ display:flex; gap:10px; padding:0 18px 6px; flex-wrap:wrap; }
  .pay-app-btn{ flex:1; min-width:100px; background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:14px 8px; border-radius:6px; text-align:center; font-size:12px; text-decoration:none; display:block; box-shadow:0 2px 8px rgba(5,42,61,.05); }
  .pay-app-btn b{ display:block; font-size:14px; margin-bottom:2px; color:var(--ink); font-style:normal; font-weight:800; font-family:var(--font-display,'Cormorant Garamond',serif); }
  .upi-box{ margin:0 18px 16px; padding:16px 18px; background:var(--panel-2); border:1px dashed var(--accent-soft); border-radius:6px; font-size:13px; text-align:center; }
  .upi-box .id{ color:var(--ink); font-family:var(--font-display,'Cormorant Garamond',serif); font-style:normal; font-weight:800; font-size:18px; margin-top:4px; word-break:break-all; }

  .ledger-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .ledger-table th{ text-align:left; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:0 6px 8px; border-bottom:1px solid var(--line); }
  .ledger-table td{ padding:9px 6px; border-bottom:1px solid var(--line); color:var(--ink); }
  .ledger-table td.num{ text-align:right; font-family:var(--font-body,'Work Sans',sans-serif); }
  .ledger-table tr:last-child td{ border-bottom:none; }
  .ledger-total{ display:flex; justify-content:space-between; padding:14px 18px; font-size:14px; border-top:1px solid var(--line); margin-top:4px; }
  .ledger-total b{ font-family:var(--font-display,'Cormorant Garamond',serif); font-style:normal; font-weight:800; font-size:17px; }

  .complaint-card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin:0 18px 12px; box-shadow:0 2px 8px rgba(5,42,61,.05); }
  .complaint-card .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .complaint-card .cat{ font-size:14px; color:var(--ink); font-weight:700; }
  .complaint-card .desc{ font-size:13px; color:var(--ink); opacity:.9; margin-top:6px; line-height:1.4; }
  .complaint-card .meta{ font-size:11px; color:var(--muted); margin-top:8px; }

  /* --- Notification Center: type accent + icon chip ---------------------
     Each entry gets a left accent bar and a small icon chip whose color
     hints at what it's about (payment / duty / meeting / complaint /
     general), so the list scans at a glance instead of reading as one
     undifferentiated wall of text. */
  .notif-card{ display:flex; gap:12px; border-left-width:3px; border-left-style:solid; }
  .notif-card.type-payment{ border-left-color:var(--accent); }
  .notif-card.type-duty{ border-left-color:var(--good); }
  .notif-card.type-meeting{ border-left-color:#6C9BD1; }
  .notif-card.type-complaint{ border-left-color:var(--danger); }
  .notif-card.type-general{ border-left-color:var(--muted); }
  .notif-icon{ flex:none; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .notif-icon svg{ width:17px; height:17px; stroke-width:1.6; }
  .notif-card.type-payment .notif-icon{ background:rgba(212,168,83,.16); color:var(--accent); }
  .notif-card.type-duty .notif-icon{ background:rgba(79,191,139,.14); color:var(--good); }
  .notif-card.type-meeting .notif-icon{ background:rgba(108,155,209,.16); color:#6C9BD1; }
  .notif-card.type-complaint .notif-icon{ background:rgba(224,107,92,.14); color:var(--danger); }
  .notif-card.type-general .notif-icon{ background:var(--panel-2); color:var(--muted); }
  .notif-card .notif-body{ flex:1; min-width:0; }
  .notif-card.is-unread{ box-shadow:0 2px 8px rgba(5,42,61,.05), 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .notif-card.is-unread .notif-icon{ animation: ms-pop .4s cubic-bezier(.2,.7,.3,1) both; }

  .meeting-card{ background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--good); border-radius:6px; padding:14px 16px; margin:0 18px 12px; box-shadow:0 2px 8px rgba(5,42,61,.05); }
  .meeting-card .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .meeting-card .title{ font-size:15px; color:var(--ink); font-weight:800; }
  .meeting-card .meta{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .meeting-card .join-btn{ background:var(--good); color:#fff; padding:8px 14px; border-radius:20px; font-size:12px; text-decoration:none; display:inline-block; margin-top:10px; }
  .meeting-platform-pill{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:20px; background:var(--panel-2); color:var(--accent); font-weight:700; }

  .chat-fab{ position:fixed; bottom:22px; right:18px; width:56px; height:56px; border-radius:50%; background:var(--good); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(5,42,61,.3); z-index:60; cursor:pointer; border:none; }
  .chat-fab svg{ width:26px; height:26px; stroke:#fff; fill:none; }
  .otp-box{ display:flex; gap:8px; margin-bottom:16px; }
  .otp-box input{ text-align:center; letter-spacing:.3em; font-size:18px; }

  .roommate-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 18px; }
  .roommate-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 12px 14px; display:flex; flex-direction:column; align-items:center; text-align:center; box-shadow:0 2px 8px rgba(5,42,61,.05); }
  .roommate-photo{ width:84px; height:84px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); margin-bottom:10px; }
  .roommate-photo-empty{ width:84px; height:84px; border-radius:50%; background:var(--panel-2); border:2px dashed var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted); margin-bottom:10px; font-family:var(--font-display,'Cormorant Garamond',serif); }
  .roommate-name{ font-size:14.5px; color:var(--ink); font-weight:800; }
  .roommate-edu{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .roommate-edit{ margin-top:10px; font-size:11px; color:var(--accent); font-weight:700; cursor:pointer; }

  /* Modern "frosted glass" pass — every card-like surface gets a soft blur,
     rounded corners, and a hairline light border so content underneath
     (the blurred hero photo, gradients) shows through, instead of flat
     opaque panels. */
  .card, .room-tile, .quick-tile, .duty-strip, .dues-card, .complaint-card,
  .meeting-card, .roommate-card, .pay-app-btn, .info-block, .upi-box,
  .instr-note{
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border-radius:16px;
  }
  .duty-strip, .info-block, .instr-note{ border-radius:14px; }
  .status-pill{ backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }

  /* "Bold text everywhere" appearance preference — a simple, safe global
     weight bump rather than editing every rule's font-weight individually. */
  html[data-bold="1"] body, html[data-bold="1"] button, html[data-bold="1"] input,
  html[data-bold="1"] select, html[data-bold="1"] textarea{ font-weight:800; }
  html[data-bold="1"] h1, html[data-bold="1"] h2, html[data-bold="1"] h3{ font-weight:900; }
  html[data-bold="1"] .muted, html[data-bold="1"] .foot-note, html[data-bold="1"] .tag{ font-weight:700; }

  /* --- Boot / refresh loading state ------------------------------------ */
  .boot-screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; }
  .spinner{ width:38px; height:38px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:ms-spin .8s linear infinite; }
  .spinner.sm{ width:16px; height:16px; border-width:2px; }
  @keyframes ms-spin{ to{ transform:rotate(360deg); } }
  .boot-screen .boot-title{ font-family:var(--font-display,'Cormorant Garamond',serif); font-style:normal; font-weight:900; font-size:24px; color:var(--ink); }
  .boot-screen .boot-msg{ font-size:12.5px; color:var(--muted); max-width:260px; }
  .sync-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }

  /* --- Payment QR + transaction history --------------------------------- */
  .qr-box{ margin:0 18px 16px; padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; text-align:center; }
  .qr-box img{ width:200px; height:200px; max-width:100%; object-fit:contain; border-radius:8px; background:#fff; padding:8px; }
  .txn-row{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 18px 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .txn-row .amt{ font-family:var(--font-display,'Cormorant Garamond',serif); font-style:normal; font-weight:800; font-size:18px; color:var(--ink); }
  .txn-row .meta{ font-size:11px; color:var(--muted); margin-top:2px; }
  .txn-row .who{ font-size:12px; color:var(--ink); font-weight:700; }
  .status-pill.status-success{ background:rgba(27,138,90,.12); color:var(--good); }
  .status-pill.status-failed{ background:rgba(224,107,92,.14); color:var(--danger); }
  .status-pill.status-pending{ background:rgba(212,168,83,.16); color:var(--accent); }

  /* --- Decent, tasteful motion -------------------------------------------
     A screen never "pops" into place with zero feedback, and a screen never
     thrashes with excess motion either — one soft fade+rise on entry, a
     gentle press-down on tap, nothing that fights the person's thumb. */
  @keyframes ms-rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes ms-pop{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:scale(1); } }
  @keyframes ms-pulse{ 0%,100%{ box-shadow:0 4px 14px rgba(5,42,61,.3), 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent);} 50%{ box-shadow:0 4px 14px rgba(5,42,61,.3), 0 0 0 8px color-mix(in srgb, var(--good) 0%, transparent);} }
  .card, .room-tile, .quick-tile, .duty-strip, .dues-card, .complaint-card,
  .meeting-card, .roommate-card, .txn-row, .qr-box, .info-block{
    animation: ms-rise .38s cubic-bezier(.2,.7,.3,1) both;
  }
  .grid .room-tile:nth-child(2), .grid .room-tile:nth-child(4), .grid .room-tile:nth-child(6){ animation-delay:.04s; }
  .roommate-grid .roommate-card:nth-child(2n){ animation-delay:.05s; }
  .modal{ animation: ms-rise .28s cubic-bezier(.2,.7,.3,1) both; }
  .modal-bg{ animation: ms-pop .18s ease both; }
  button, .quick-tile, .room-tile, .roommate-card{ transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease; }
  button:active, .quick-tile:active, .room-tile:active{ transform: scale(.96); }
  .chat-fab{ animation: ms-pulse 2.6s ease-in-out infinite; }
  .chat-fab:active{ transform:scale(.9); }
  a, .roommate-edit, .status-pill{ transition: color .15s ease, background .15s ease; }
  @media (prefers-reduced-motion: reduce){
    .card,.room-tile,.quick-tile,.duty-strip,.dues-card,.complaint-card,.meeting-card,
    .roommate-card,.txn-row,.qr-box,.info-block,.modal,.modal-bg,.chat-fab{ animation:none !important; }
  }

  /* --- House Chat (WhatsApp-style group chat) ---------------------------- */
  .chat-screen{ display:flex; flex-direction:column; height:calc(100vh - 62px); }
  .chat-thread{ flex:1; overflow-y:auto; padding:14px 12px 6px; display:flex; flex-direction:column; gap:10px; }
  .chat-day-sep{ text-align:center; font-size:11px; color:var(--muted); margin:8px 0 2px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .chat-bubble-row{ display:flex; flex-direction:column; max-width:78%; animation: ms-rise .22s ease both; }
  .chat-bubble-row.me{ align-self:flex-end; align-items:flex-end; }
  .chat-bubble-row.them{ align-self:flex-start; align-items:flex-start; }
  .chat-sender{ font-size:11px; font-weight:800; color:var(--accent); margin:0 4px 3px; }
  .chat-bubble{ padding:9px 12px; border-radius:16px; font-size:14px; line-height:1.4; word-break:break-word; box-shadow:0 2px 8px rgba(5,42,61,.08); }
  .chat-bubble-row.me .chat-bubble{ background:var(--accent); color:#16273F; border-bottom-right-radius:4px; font-weight:600; }
  .chat-bubble-row.them .chat-bubble{ background:var(--panel); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:4px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .chat-bubble img.chat-img{ max-width:220px; max-height:260px; border-radius:12px; display:block; object-fit:cover; }
  .chat-bubble audio{ max-width:220px; height:36px; }
  .chat-bubble video.chat-video{ max-width:240px; max-height:300px; border-radius:12px; display:block; background:#000; }
  .chat-bubble.sticker{ background:transparent !important; border:none !important; box-shadow:none; font-size:44px; padding:2px; }
  .chat-bubble.media{ background:transparent !important; border:none !important; box-shadow:none; padding:0; }
  .chat-file-card{ display:flex; align-items:center; gap:10px; width:220px; max-width:64vw; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:14px; text-decoration:none; color:inherit; box-shadow:0 2px 8px rgba(5,42,61,.08); }
  .chat-file-icon{ flex:none; font-size:22px; }
  .chat-file-info{ min-width:0; display:flex; flex-direction:column; gap:2px; }
  .chat-file-name{ font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-file-size{ font-size:11px; color:var(--muted); }
  .chat-time{ font-size:10px; color:var(--muted); margin-top:3px; }
  .chat-inputbar{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border-top:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .chat-inputbar input[type=text]{ flex:1; margin:0; border-radius:22px; padding:11px 16px; }
  .chat-icon-btn{ width:40px; height:40px; min-width:40px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:18px; }
  .chat-icon-btn.rec{ background:var(--danger); color:#fff; }
  .chat-icon-btn svg{ width:19px; height:19px; stroke:currentColor; fill:none; }
  .chat-send-btn{ width:42px; height:42px; min-width:42px; border-radius:50%; background:var(--good); color:#fff; display:flex; align-items:center; justify-content:center; }
  .chat-send-btn svg{ width:19px; height:19px; fill:#fff; }
  .sticker-panel{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; padding:10px 12px; background:var(--panel); border-top:1px solid var(--line); max-height:160px; overflow-y:auto; }
  .sticker-panel span{ font-size:26px; text-align:center; cursor:pointer; padding:4px; border-radius:8px; }
  .sticker-panel span:active{ background:var(--panel-2); }
  .chat-empty{ text-align:center; color:var(--muted); font-size:13px; padding:40px 20px; }
</style>
